<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Mood Meter</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#232634">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mood Meter">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* The page never scrolls: html/body are locked, and the stage is sized
     to leave room for the bar and hint below. */
  html {
    height: 100%;
    height: 100dvh; /* follow the real visible surface (fullscreen bar hide) */
    background: #232634; /* no flash of black when the viewport resizes */
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    background: #232634;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    justify-content: safe center; /* don't clip the top when overflowing */
    gap: 16px;
    padding:
      calc(16px + env(safe-area-inset-top, 0px))
      calc(16px + env(safe-area-inset-right, 0px))
      calc(16px + env(safe-area-inset-bottom, 0px))
      calc(16px + env(safe-area-inset-left, 0px));
    font-family: Verdana, "DejaVu Sans", Geneva, sans-serif;
    color: #c6d0f5;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation; /* no double-tap zoom; the canvas opts out fully */
  }

  /* Framed like the status panel, so meter, status and buttons match.
     Width caps: 92vw, 90dvh, and "whatever is left of the viewport after
     the bar and hint below" (stage height = width / 1.162). */
  .stage {
    width: min(92vw, 90vh, calc((100vh - 170px - env(safe-area-inset-top, 0px)) * 1.162));
    width: min(92vw, 90dvh, calc((100dvh - 170px - env(safe-area-inset-top, 0px)) * 1.162));
    aspect-ratio: 1220 / 1050;
    background: #303446;
    border: 2px solid #51576d;
    border-radius: 6px;
    overflow: hidden;
  }

  /* Below ~720px the bar wraps to two rows and the hint to two lines. */
  @media (max-width: 720px) {
    .stage {
      width: min(92vw, calc((100vh - 235px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 1.162));
      width: min(92vw, calc((100dvh - 235px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 1.162));
    }
  }

  #meter {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: stretch;
    justify-content: center;
    gap: 10px;
  }

  .status {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 340px;
    max-width: 92vw;
    padding: 8px 18px;
    min-height: 73px; /* two 13px/22px lines + padding + borders, so the empty state keeps the placed state's height */
    background: #414559;
    color: #c6d0f5;
    border: 2px solid #51576d;
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.5;
    text-align: center;
    user-select: none;
  }

  /* The two lines never wrap, so a flash message can't change the box size. */
  .status span { white-space: nowrap; }

  .status .mood {
    font-family: "Bebas Neue", Impact, Haettenschweiler, "Arial Narrow", sans-serif;
    color: #8caaee;
    font-size: 22px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  /* Empty state: collapse the blank mood line, enlarge the message, and
     park it just below center — where the stats line will appear — while
     the box keeps its two-line size. */
  .status:has(.mood.empty) { justify-content: flex-start; padding-top: 22px; }
  .status:has(.mood.empty) span:first-child { font-size: 15px; }
  .status .mood.empty { font-size: 0; }
  .status .flash {
    font-family: "Bebas Neue", Impact, Haettenschweiler, "Arial Narrow", sans-serif;
    color: #8caaee;
    font-size: 22px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  button {
    font-family: "Bebas Neue", Impact, Haettenschweiler, "Arial Narrow", sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: #8caaee;
    color: #292c3c;
    border: 2px solid #51576d;
    border-radius: 6px;
    padding: 10px 22px 7px;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:hover:not(:disabled) { background: transparent; border-color: #8caaee; color: #8caaee; }
  button:disabled { opacity: 0.35; cursor: default; }
  button:focus-visible { outline: 2px solid #8caaee; outline-offset: 2px; }

  .hint { font-size: 12px; color: #a5adce; text-align: center; max-width: 92vw; }

  /* Quiet install prompt pinned to the bottom edge; hidden until installable. */
  .install-pill {
    position: fixed;
    left: 50%;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 10px);
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 4px 14px;
    background: rgba(65, 69, 89, 0.92);
    border: 2px solid #51576d;
    border-radius: 999px;
    box-shadow: 0 6px 24px rgba(23, 26, 35, 0.5);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease;
    z-index: 10;
  }
  .install-pill[hidden] { display: none; }
  .install-pill.show {
    opacity: 1;
    transform: translate(-50%, 0);
    pointer-events: auto;
  }
  .install-pill button {
    font-family: "Bebas Neue", Impact, Haettenschweiler, "Arial Narrow", sans-serif;
    background: transparent;
    border: 0;
    border-radius: 999px;
    cursor: pointer;
  }
  .install-pill .install-accept {
    color: #8caaee;
    font-size: 16px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 5px 8px 2px;
    white-space: nowrap;
  }
  .install-pill button:hover:not(:disabled) { background: transparent; color: #c6d0f5; }
</style>
</head>
<body>

<div class="stage"><canvas id="meter" width="1220" height="1050"></canvas></div>

<div class="bar">
  <div class="status" id="status"><span>Click on the meter to place your dot</span><span class="mood empty">&nbsp;</span></div>
  <button id="download" disabled>Download PNG</button>
  <button id="copy" disabled>Copy image</button>
  <button id="share" disabled hidden>Share</button>
</div>
<div class="hint">Click or drag on the graph to place the dot — blank space doesn't count · export, copy or share a 2440×2100 PNG</div>

<div class="install-pill" id="installPill" hidden>
  <button class="install-accept" id="installAccept" type="button">Install</button>
</div>

<script>
"use strict";

/* Catppuccin Frappé palette */
const INK = "#c6d0f5";       /* text — margin/background elements */
const INK_ZONE = "#292c3c";  /* mantle — text on the pastel zones */
const BLUE = "#8caaee";
const CRUST = "#232634";
const VERD = "Verdana, 'DejaVu Sans', Geneva, sans-serif";
const BEBAS = "'Bebas Neue', Impact, Haettenschweiler, 'Arial Narrow', sans-serif";

/* Laid out on a 1000×1000 grid (1% = 10 units). The left/right margins
   match so the graph is centered, and every corner of the meter hosts a
   hidden easter-egg zone; PAD_T keeps the title clear of the top edge. */
const PAD_R = 220;
const PAD_T = 50;
const MW = 1000 + PAD_R;
const MH = 1000 + PAD_T;

/* Readout axes: origin (0;0) at the "Mom would be sad" corner of the graph,
   so the hidden easter-egg corners beyond the graph read off-scale. */
const GX0 = 220;   // meter x of pleasantness 0
const GY0 = 875;   // meter y of energy 0
const GX1 = 1000;  // meter x of pleasantness 100
const GY1 = 97;    // meter y of energy 100

function statsOf(p) {
  return {
    pleasant: Math.round((p.x - GX0) / (GX1 - GX0) * 100),
    energy: Math.round((GY0 - p.y) / (GY0 - GY1) * 100),
  };
}

/* Download name carries the placement stats and a day-month-year date,
   e.g. Mood_09-09-26_p38_e30.png. */
function exportFileName() {
  const s = statsOf(dot);
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  const date = pad(d.getDate()) + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getFullYear() % 100);
  return "Mood_" + date + "_p" + s.pleasant + "_e" + s.energy + ".png";
}

/* [name, x, y, w, h, fill, readout label] — the last four entries are the
   hidden easter-egg corners: placeable like any other zone, but blank
   until the pointer or the dot is on them. */
const ZONES = [
  ["red",      220,  97, 395, 250, "#e78284", "Fuck it we ball"],
  ["tan",      615,  97, 385, 393, "#f2d5cf", "We are so fucking back"],
  ["yellow",   870,  97, 130, 121, "#e5c890", "Lets Fucking Goooooooo"],
  ["orange-h", 220, 347, 512, 144, "#ef9f76", "It is what it is"],
  ["orange-v", 615, 490, 117, 385, "#ef9f76", "It is what it is"],
  ["blue",     220, 490, 395, 385, "#8caaee", "It's so over"],
  ["blue-sm",  220, 750, 123, 125, "#85c1dc", "Mom would be sad"],
  ["green",    732, 490, 268, 385, "#a6d189", "We vibing"],
  ["tl",         0, -50, 220, 147, "#ea999c", "We are so fucking cooked"],
  ["tr",      1000, -50, 220, 147, "#f4b8e4", "On top of the world"],
  ["bl",         0, 875, 220, 125, "#ca9ee6", "Hey guys I guess that's it"],
  ["br",      1000, 875, 220, 125, "#babbf1", "We sleeping"],
];

const HIDDEN = new Set(["tl", "tr", "bl", "br"]);

/* Caption lines per hidden corner: [text, x, y] in meter units. */
const CORNER_TEXTS = {
  tl: [["We are so", 110, 7],
       ["fucking cooked", 110, 40]],
  tr: [["On top of", 1110, 7],
       ["the world", 1110, 40]],
  bl: [["Hey guys", 110, 914.6],
       ["I guess that's it", 110, 948.4]],
  br: [["We sleeping", 1110, 905]],
};

/* [text, x, y, font, color, letterSpacing] */
const TEXTS = [
  ["THE MOOD METER", 600, 38, "82px " + BEBAS, INK, 0],

  ["Fuck it", 417.5, 181.8, "70px " + VERD, INK_ZONE, 0],
  ["we ball", 417.5, 262.3, "70px " + VERD, INK_ZONE, 0],

  ["LETS FUCKING", 935, 146.1, "13.5px " + VERD, INK_ZONE, 0],
  ["GOOOOOOO",    935, 165.0, "13.5px " + VERD, INK_ZONE, 0],

  ["It's so", 417.5, 587.9, "78px " + VERD, INK_ZONE, 0],
  ["over",    417.5, 677.6, "78px " + VERD, INK_ZONE, 0],

  ["Mom would", 281.5, 801.3, "600 16px " + VERD, INK_ZONE, 0],
  ["be sad",    281.5, 823.7, "600 16px " + VERD, INK_ZONE, 0],

  ["We",     866, 586.7, "76px " + VERD, INK_ZONE, 0],
  ["vibing", 866, 674.1, "76px " + VERD, INK_ZONE, 0],

  ["HIGH",       140, 220.5, "39px " + BEBAS, BLUE, 0],
  ["ENERGY",     140, 261.5, "39px " + BEBAS, BLUE, 0],
  ["LOW",        140, 735.5, "39px " + BEBAS, BLUE, 0],
  ["ENERGY",     140, 776.5, "39px " + BEBAS, BLUE, 0],
  ["UNPLEASANT", 345, 906.5, "39px " + BEBAS, BLUE, 0],
  ["PLEASANT",   865, 906.5, "39px " + BEBAS, BLUE, 0],
];

/* [lines, x, y, deg, lineHeight, font, color, letterSpacing] */
const ROTATED = [
  [["It is"], 420, 415, 0, 95, "95px " + VERD, INK_ZONE, 1.5],
  [["what"], 635, 460, 46, 78, "78px " + VERD, INK_ZONE, 1.5],
  [["it is"], 680, 645, 90, 90, "90px " + VERD, INK_ZONE, 3],
  [["We are so", "fucking back"], 790, 295, 45, 62, "59px " + VERD, INK_ZONE, 0],
];

/* [x1, y1, x2, y2, thickness, tips] — tips are two arrowhead triangles */
const ARROWS = [
  [153, 336, 153, 644, 7.5,
    [[[153, 315], [140.5, 339.5], [165.5, 339.5]],
     [[153, 665], [140.5, 640.5], [165.5, 640.5]]]],
  [478, 910, 742, 910, 7.5,
    [[[460, 910], [481, 897.5], [481, 922.5]],
     [[760, 910], [739, 897.5], [739, 922.5]]]],
];

function drawDot(ctx, p, r) {
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
  ctx.fillStyle = INK; ctx.fill();
  ctx.beginPath(); ctx.arc(p.x, p.y, r * 2 / 3, 0, Math.PI * 2);
  ctx.fillStyle = CRUST; ctx.fill();
}

function drawMeter(ctx, sx, sy, dot, ghost, alphas, zzz, credit, r) {
  ctx.setTransform(sx, 0, 0, sy, 0, PAD_T * sy);

  ctx.fillStyle = "#303446";
  ctx.fillRect(0, -PAD_T, MW, MH);

  for (const z of ZONES) {
    if (HIDDEN.has(z[0])) continue; // hidden corners — drawn conditionally below
    ctx.fillStyle = z[5];
    ctx.fillRect(z[1], z[2], z[3], z[4]);
  }

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (const [t, x, y, font, color, ls] of TEXTS) {
    ctx.font = font;
    ctx.fillStyle = color;
    ctx.letterSpacing = ls + "px";
    ctx.fillText(t, x, y);
  }
  for (const [lines, x, y, deg, lh, font, color, ls] of ROTATED) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(deg * Math.PI / 180);
    ctx.font = font;
    ctx.fillStyle = color;
    ctx.letterSpacing = ls + "px";
    const top = -((lines.length - 1) * lh) / 2;
    for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], 0, top + i * lh);
    ctx.restore();
  }
  ctx.letterSpacing = "0px";

  ctx.fillStyle = BLUE;
  for (const [x1, y1, x2, y2, w, tips] of ARROWS) {
    ctx.fillRect(Math.min(x1, x2) - w / 2, Math.min(y1, y2) - w / 2,
                 Math.abs(x2 - x1) + w, Math.abs(y2 - y1) + w);
    for (const tip of tips) {
      ctx.beginPath();
      ctx.moveTo(tip[0][0], tip[0][1]);
      ctx.lineTo(tip[1][0], tip[1][1]);
      ctx.lineTo(tip[2][0], tip[2][1]);
      ctx.closePath();
      ctx.fill();
    }
  }

  /* Site credit — exports only, never shown on the live page. */
  if (credit) {
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "22px " + BEBAS;
    ctx.fillStyle = BLUE;
    ctx.letterSpacing = "2px";
    ctx.fillText("tajo48.github.io/mood-meter", 610, 972);
    ctx.letterSpacing = "0px";
  }

  /* Hidden corners: blank until the pointer or the dot is on them; they
     export only when the dot is placed on them. While the sleeping corner
     (br) is revealed, its z's drift up in a loop. */
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.letterSpacing = "0px";
  for (const z of ZONES) {
    if (!HIDDEN.has(z[0])) continue;
    const a = alphas[z[0]] || 0;
    if (a <= 0) continue;
    ctx.globalAlpha = a;
    ctx.fillStyle = z[5];
    ctx.fillRect(z[1], z[2], z[3], z[4]);
    ctx.fillStyle = INK_ZONE;
    ctx.font = "700 27px Arial, Helvetica, sans-serif";
    for (const [t, x, y] of CORNER_TEXTS[z[0]]) ctx.fillText(t, x, y);
    if (z[0] === "br") { // sleeping corner: drifting z's
      for (let i = 0; i < 3; i++) {
        const p = (zzz + i / 3) % 1;
        ctx.globalAlpha = a * Math.sin(Math.PI * p);
        ctx.font = "italic 700 " + Math.round(24 - 10 * p) + "px Arial, Helvetica, sans-serif";
        ctx.fillText("z", 1100 + 60 * p, 975 - 35 * p);
      }
    }
    ctx.globalAlpha = 1;
  }

  if (ghost) {
    ctx.globalAlpha = 0.35;
    drawDot(ctx, ghost, r);
    ctx.globalAlpha = 1;
  }
  if (dot) drawDot(ctx, dot, r);
}

/* ---------- app ---------- */

const canvas = document.getElementById("meter");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const downloadBtn = document.getElementById("download");
const copyBtn = document.getElementById("copy");
const shareBtn = document.getElementById("share");

let dot = null;
let hover = null;
let dragging = false;
let dragTarget = null; // where the dot glides toward while/after dragging
let direct = false;    // tap-to-move glides straight to the target
let dotR = 22; // dot radius in meter units; capped on small screens (see redraw)
const EXPORT_DOT_R = 26; // ≈ the phone dot in meter units (7.5 css px on a ~350 px canvas)
let lastFrameTs = 0;
let glideStuck = 0;
let flashTimer = 0;
let animating = false;
let zzz = 0; // drift phase for the sleeping corner's z's
const hiddenAlpha = {};
for (const k of HIDDEN) hiddenAlpha[k] = 0;

function redraw() {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(canvas.clientWidth * dpr));
  const h = Math.max(1, Math.round(canvas.clientHeight * dpr));
  if (canvas.width !== w) canvas.width = w;
  if (canvas.height !== h) canvas.height = h;
  /* Phones: cap the dot at 7.5 css px of radius — half of the original
     15 css px floor. 416 is where the 22-unit desktop base renders to
     exactly that, so the switch is seamless. */
  const cw = Math.max(1, canvas.clientWidth);
  dotR = cw < 416 ? 7.5 * MW / cw : 22;
  const ghost = !dragging && hover && zoneAt(hover) ? hover : null;
  drawMeter(ctx, w / MW, h / MH, dot, ghost, hiddenAlpha, zzz, false, dotR);
  canvas.style.cursor = hover && zoneAt(hover) ? "crosshair" : "default";
}

function toMeter(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) / r.width * MW,
    y: (e.clientY - r.top) / r.height * MH - PAD_T,
  };
}

/* Touch pointing: the finger would cover the dot, so the effective point
   rides a little above it. The lift fades out near the top and bottom
   edges so the hidden corner zones stay reachable by touch. */
const TOUCH_LIFT_PX = 40;

function toPoint(e) {
  const p = toMeter(e);
  if (e.pointerType === "touch") {
    const lift = (TOUCH_LIFT_PX * MW) / Math.max(1, canvas.clientWidth);
    const fromTop = Math.max(0, p.y + PAD_T);
    const fromBottom = Math.max(0, MH - PAD_T - p.y);
    p.y -= lift * Math.min(1, Math.min(fromTop, fromBottom) / lift);
  }
  return p;
}

function zoneAt(p) {
  if (!p) return null;
  for (let i = ZONES.length - 1; i >= 0; i--) {
    const z = ZONES[i];
    if (p.x >= z[1] && p.x <= z[1] + z[3] && p.y >= z[2] && p.y <= z[2] + z[4]) return z;
  }
  return null;
}

/* Zone spans along one axis, at a fixed coordinate on the other axis. */
function spansAt(v, axis) {
  const out = [];
  for (const z of ZONES) {
    const inside = axis === "x" ? v >= z[2] && v <= z[2] + z[4] : v >= z[1] && v <= z[1] + z[3];
    if (inside) out.push(axis === "x" ? [z[1], z[1] + z[3]] : [z[2], z[2] + z[4]]);
  }
  return out;
}

function mergedSpans(spans) {
  spans.sort((a, b) => a[0] - b[0]);
  const out = [];
  for (const s of spans) {
    const last = out[out.length - 1];
    if (last && s[0] <= last[1]) last[1] = Math.max(last[1], s[1]);
    else out.push([s[0], s[1]]);
  }
  return out;
}

/* How far `from` can move toward `to` without leaving the spans. */
function slideWithin(from, to, spans) {
  for (const [a, b] of spans) {
    if (from >= a && from <= b) return Math.min(Math.max(to, a), b);
  }
  return from;
}

/* One frame of the dot chasing the drag target: instead of freezing in
   blank space and snapping when the pointer re-enters a zone, it glides
   along tile edges — and never leaves the tiles. */
const GLIDE_SMOOTH = 15; // smoothing per second: higher = snappier follow

/* Frame-rate-independent exponential approach: velocity is proportional to
   the remaining distance, so the glide is steady at any frame rate and
   eases in and out — no sudden halts or jumps. */
function smoothToward(from, to, dt) {
  const k = 1 - Math.exp((-GLIDE_SMOOTH * dt) / 1000);
  return { x: from.x + (to.x - from.x) * k, y: from.y + (to.y - from.y) * k };
}

function glideStep(dt) {
  const t = dragTarget;
  if (!t || !dot) return false;
  const dx = t.x - dot.x;
  const dy = t.y - dot.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 0.75) return false;
  const p = smoothToward(dot, t, dt);
  let tx = p.x;
  let ty = p.y;
  // Slide the dominant axis first so diagonals glide around corners.
  if (Math.abs(dx) >= Math.abs(dy)) {
    tx = slideWithin(dot.x, tx, mergedSpans(spansAt(dot.y, "x")));
    ty = slideWithin(dot.y, ty, mergedSpans(spansAt(tx, "y")));
  } else {
    ty = slideWithin(dot.y, ty, mergedSpans(spansAt(dot.x, "y")));
    tx = slideWithin(dot.x, tx, mergedSpans(spansAt(ty, "x")));
  }
  if (tx === dot.x && ty === dot.y) return false;
  dot = { x: tx, y: ty };
  return true;
}

/* One frame of a tap-to-move glide: straight from the dot to the clicked
   point, no detours — tiles and blank space alike are crossed directly. */
function directStep(dt) {
  if (!dragTarget || !dot) return false;
  const dist = Math.hypot(dragTarget.x - dot.x, dragTarget.y - dot.y);
  if (dist < 0.75) {
    dragTarget = null;
    direct = false;
    return false;
  }
  dot = smoothToward(dot, dragTarget, dt);
  return true;
}

/* The hidden corners are placeable zones like any other: blank until the
   pointer (or the dot) is on them — a dot placed there keeps them revealed. */
function hiddenTarget(key) {
  const h = zoneAt(hover);
  const d = zoneAt(dot);
  return (h && h[0] === key) || (d && d[0] === key) ? 1 : 0;
}

function needsFrame() {
  if (dragTarget && dot && Math.hypot(dragTarget.x - dot.x, dragTarget.y - dot.y) >= 0.75) {
    return true; // the dot is still gliding toward its target
  }
  for (const k of HIDDEN) {
    if (hiddenAlpha[k] !== hiddenTarget(k)) return true;
  }
  return hiddenAlpha.br > 0.01; // z's keep drifting while the sleeping corner is up
}

function kickAnimate() {
  if (!animating && needsFrame()) {
    animating = true;
    requestAnimationFrame(animate);
  }
}

function animate(ts) {
  const dt = lastFrameTs ? Math.min(50, ts - lastFrameTs) : 16.7;
  lastFrameTs = ts;

  const moved = direct ? directStep(dt) : glideStep(dt);
  if (moved) glideStuck = 0;
  else if (dragTarget && dot) glideStuck++;
  else glideStuck = 0;
  if (glideStuck > 40) dragTarget = null; // safety: stop chasing a dead end

  for (const k of HIDDEN) {
    const t = hiddenTarget(k);
    hiddenAlpha[k] += (t - hiddenAlpha[k]) * 0.25;
    if (Math.abs(t - hiddenAlpha[k]) < 0.01) hiddenAlpha[k] = t;
  }
  zzz = (zzz + 0.008) % 1;
  redraw();
  if (moved) updateStatus();
  if (needsFrame()) {
    requestAnimationFrame(animate);
  } else {
    animating = false;
    lastFrameTs = 0;
  }
}

/* The status box always renders two lines, so its height never changes
   between the empty, placed, and flash states. */
let lastStatusHTML = "";

function updateStatus() {
  downloadBtn.disabled = copyBtn.disabled = shareBtn.disabled = !dot;
  let top = "Click on the meter to place your dot";
  let mood = "\u00a0";
  if (dot) {
    const s = statsOf(dot);
    top = "Pleasantness " + s.pleasant + "% · Energy " + s.energy + "%";
    const z = zoneAt(dot);
    if (z) mood = z[6];
  }
  const html = "<span>" + top + "</span><span class='mood" + (dot ? "" : " empty") + "'>" + mood + "</span>";
  if (html === lastStatusHTML) return; // glide frames often change nothing
  lastStatusHTML = html;
  statusEl.innerHTML = html;
}

function flash(msg) {
  /* Keep the stats line and swap the blue mood line, so the box keeps its
     exact size in every state. */
  const top = statusEl.firstElementChild ? statusEl.firstElementChild.outerHTML : "<span></span>";
  const html = top + "<span class='flash'>" + msg + "</span>";
  lastStatusHTML = html;
  statusEl.innerHTML = html;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(updateStatus, 2500);
}

/* Some mobile browsers drop or swallow pointerdown. Track pressed pointers
   at the window level so a press that starts off-chart (or gets lost) can
   still place the dot when it slides onto a zone; also end the drag when
   the last pointer is released outside the canvas. */
const activePointers = new Set();
window.addEventListener("pointerdown", (e) => activePointers.add(e.pointerId), true);
window.addEventListener("pointerup", (e) => {
  activePointers.delete(e.pointerId);
  if (activePointers.size === 0) dragging = false;
}, true);
window.addEventListener("pointercancel", (e) => {
  activePointers.delete(e.pointerId);
  if (activePointers.size === 0) dragging = false;
}, true);

canvas.addEventListener("pointerdown", (e) => {
  const p = toPoint(e);
  hover = p;
  if (!zoneAt(p)) {
    // Blank space isn't clickable.
    dragTarget = null;
    direct = false;
    kickAnimate();
    redraw();
    return;
  }
  e.preventDefault();
  dragging = true;
  dragTarget = p;
  direct = true; // glide straight from the dot to the clicked spot
  if (!dot) dot = p; // first placement is instant
  // Capture can throw if the pointer is already inactive — the dot is
  // placed by now, so a failure must not undo the tap.
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  redraw();
  updateStatus();
  kickAnimate();
});

canvas.addEventListener("pointermove", (e) => {
  const p = toPoint(e);
  hover = p;
  if (dragging) {
    if (direct && Math.hypot(p.x - dragTarget.x, p.y - dragTarget.y) < 12) {
      // still a tap: tiny finger wobble keeps the straight glide
    } else {
      dragTarget = p; // the dot glides after it in animate()
      direct = false; // a real drag follows the finger along the tile edges
    }
  } else if (activePointers.size > 0 && zoneAt(p)) {
    /* pointerdown was lost or landed on blank space: the first zone hit
       mid-gesture places the dot, so dragging in from off-chart works
       for mouse and touch alike. */
    dragging = true;
    dragTarget = p;
    direct = true;
    if (!dot) dot = p;
    updateStatus();
  }
  kickAnimate();
  redraw();
});

canvas.addEventListener("pointerup", (e) => {
  const wasDragging = dragging;
  dragging = false;
  /* Same quirk: if pointerdown never arrived, a tap that lands on a zone
     must still place the dot. */
  if (!wasDragging && e.pointerType !== "mouse") {
    const p = toPoint(e);
    if (zoneAt(p)) {
      dragTarget = p;
      direct = true;
      if (!dot) dot = p;
      updateStatus();
    }
  }
  // dragTarget stays behind, so the dot finishes its glide after release.
  hover = e.pointerType === "mouse" ? toPoint(e) : null;
  kickAnimate();
  redraw();
});

canvas.addEventListener("pointerleave", () => {
  hover = null;
  kickAnimate();
  redraw();
});

canvas.addEventListener("pointercancel", () => {
  dragging = false;
  dragTarget = null;
  direct = false;
  hover = null;
  kickAnimate();
  redraw();
});

canvas.addEventListener("contextmenu", (e) => e.preventDefault());

function renderExportCanvas() {
  const c = document.createElement("canvas");
  c.width = 2 * MW;
  c.height = 2 * MH;
  // The hidden corners export only when the dot is placed on them.
  const dz = zoneAt(dot);
  const alphas = {};
  for (const k of HIDDEN) alphas[k] = dz && dz[0] === k ? 1 : 0;
  drawMeter(c.getContext("2d"), 2, 2, dot, null, alphas, zzz, true, EXPORT_DOT_R);
  return c;
}

downloadBtn.addEventListener("click", () => {
  renderExportCanvas().toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = exportFileName();
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, "image/png");
});

/* When the platform can share image files (installed PWA, or desktop
   Chrome/Edge), the Share button joins Download + Copy; otherwise it stays
   hidden and the other two cover everything. */
const canShareFiles =
  typeof navigator.share === "function" &&
  typeof navigator.canShare === "function" &&
  typeof File !== "undefined" &&
  navigator.canShare({ files: [new File(["x"], "x.png", { type: "image/png" })] });
if (canShareFiles) shareBtn.hidden = false;

copyBtn.addEventListener("click", async () => {
  try {
    const blob = await new Promise((res) => renderExportCanvas().toBlob(res, "image/png"));
    await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
    flash("Copied to clipboard");
  } catch {
    flash("Use Download instead");
  }
});

shareBtn.addEventListener("click", async () => {
  const s = statsOf(dot);
  try {
    const blob = await new Promise((res) => renderExportCanvas().toBlob(res, "image/png"));
    await navigator.share({
      files: [new File([blob], exportFileName(), { type: "image/png" })],
      title: "Mood Meter",
      text: "Pleasantness " + s.pleasant + "% · Energy " + s.energy + "%",
    });
    flash("Shared");
  } catch (err) {
    if (err.name === "AbortError") return; // sheet dismissed — do nothing
    flash("Share failed");
  }
});

new ResizeObserver(redraw).observe(canvas);
if (document.fonts) {
  document.fonts.load('82px "Bebas Neue"').then(redraw).catch(() => {});
  document.fonts.ready.then(redraw);
}
redraw();
updateStatus(); // sync button state + the empty-state mood line on load

/* ---------- install prompt ---------- */

/* A quiet pill at the bottom edge: shows whenever the app is installable
   and not installed, and keeps showing — only an actual install hides it. */

const pill = document.getElementById("installPill");
const installBtn = document.getElementById("installAccept");
let deferredPrompt = null;
let pillTimer = 0;
let pillDismissed = false; // set when the install completes

function isInstalled() {
  return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
}

function showPill() {
  if (isInstalled() || pillDismissed) return;
  clearTimeout(pillTimer);
  pill.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => pill.classList.add("show")));
}

function hidePill() {
  clearTimeout(pillTimer);
  pill.classList.remove("show");
  pillTimer = setTimeout(() => {
    pill.hidden = true;
  }, 400);
}

function showPillSoon() {
  clearTimeout(pillTimer);
  pillTimer = setTimeout(showPill, 1200);
}

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault(); // keep Chrome's own infobar out of sight
  deferredPrompt = e;
  installBtn.textContent = "Install";
  showPillSoon();
});

window.addEventListener("appinstalled", () => {
  deferredPrompt = null;
  pillDismissed = true;
  hidePill();
});

window.matchMedia("(display-mode: standalone)").addEventListener("change", (e) => {
  if (e.matches) {
    pillDismissed = true;
    hidePill();
  }
});

installBtn.addEventListener("click", async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    if (outcome === "accepted") {
      pillDismissed = true;
      hidePill();
    }
    // Declined: the pill stays put — the user may change their mind.
  } else {
    // iOS Safari has no install API; spell out how, and keep it spelled out.
    installBtn.textContent = "Share → Add to Home Screen";
  }
});

/* iOS never fires beforeinstallprompt, so surface the pill there ourselves. */
const isIOS =
  /iP(hone|ad|od)/.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
if (isIOS && !("onbeforeinstallprompt" in window)) {
  installBtn.textContent = "Add to Home Screen";
  showPillSoon();
}

/* ---------- pwa ---------- */

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").then((reg) => {
      // Check for an update right away; controllerchange below reloads when
      // the new worker takes over, so a fresh launch never lags a deploy.
      reg.update().catch(() => {});
      // Installed PWAs can stay open for days without a normal navigation,
      // which is the only time browsers otherwise bother re-checking sw.js.
      // Poke it whenever the app regains focus, and every 30 minutes while open.
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") reg.update().catch(() => {});
      });
      setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
    }).catch(() => {});
  });

  // Once a new service worker takes control, the page it controls is still
  // running old JS in memory — reload once so the update actually shows up.
  let swRefreshing = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (swRefreshing) return;
    swRefreshing = true;
    window.location.reload();
  });
}

/* Installed PWAs launch standalone on the first open after install (the
   manifest's fullscreen mode only applies from the next cold start), so
   promote to fullscreen on the first tap of that session. Skipped in a
   normal browser tab so the page never hijacks the browser UI. */
if (
  !document.fullscreenElement &&
  document.documentElement.requestFullscreen &&
  matchMedia("(display-mode: standalone)").matches
) {
  const goFullscreen = () => {
    document.documentElement.requestFullscreen().catch(() => {});
  };
  addEventListener("pointerdown", goFullscreen, { once: true, capture: true });
}

/* Cold-start bug workaround: right after the splash screen Chrome can size
   the renderer for the old viewport (status bar still in it) and never fires
   a resize when that changes — the layout stays short until minimize/reopen
   or rotation. Pin the root height to the real visual viewport whenever the
   surface may have settled, which forces the layout to full size. */
const root = document.documentElement;
function syncViewport() {
  const vv = window.visualViewport;
  if (!vv) return;
  const target = Math.round(vv.height) + "px";
  if (root.style.height !== target) root.style.height = target;
}
syncViewport();
addEventListener("resize", syncViewport);
addEventListener("pageshow", syncViewport);
document.addEventListener("visibilitychange", syncViewport);
window.visualViewport?.addEventListener("resize", syncViewport);
for (const delay of [100, 300, 800, 1500, 3000]) setTimeout(syncViewport, delay);

/* Deeper workaround for the same cold-start bug: minimize/reopen or rotation
   makes Chrome recompute the immersive window state, so a fullscreen
   enter/exit toggle is used as the programmatic equivalent. Tried once
   shortly after load (usually rejected without a gesture) and again on the
   first tap, which the browser accepts. */
async function nudgeImmersive() {
  try {
    await document.documentElement.requestFullscreen();
    await document.exitFullscreen();
  } catch {}
}
if (matchMedia("(display-mode: fullscreen)").matches) {
  setTimeout(nudgeImmersive, 500);
  addEventListener("pointerdown", nudgeImmersive, { once: true, capture: true });
}
</script>
